<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <style>
        input { 
            margin-bottom: 8px;
        }
    </style>
    <title>Cadastro de usuário</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="display-1">
                    Cadastre-se
                </h1>
                <form>
                    <label for="nome-person" class="form-label h5">Seu nome:</label>
                    <input type="text" id="nome-person" class="form-control" placeholder="Nome Completo"/>
                    <label for="nome-user" class="form-label h5" >Seu nome de usuário:</label>
                    <input type="text" id="nome-user" class="form-control" placeholder="Usuario123" />
                    <label for="email" class="form-label h5">Seu e-mail:</label>
                    <input type="email" id="email" class="form-control" placeholder="anonimo@gmail.com" />
                    <label for="telefone" class="form-label h5">Seu telefone</label>
                    <input type="tel" id="telefone" class="form-control" placeholder="(11)11111-1111" />
                    <button class="btn btn-success">Enviar cadastro</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
