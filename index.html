<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Formulário Teste</title>
</head>
<body>
    <section>
        <h1> Formulário </h1>
        <form id="formulario">
            <input id="campoA" type="number" placeholder="Coloque um valor númerico">
            <input id="campoB" type="number" placeholder="Coloque um valor númerico">
            <button type="submit"> Comparar </button>
            <button type="reset"> Limpar campos </button>
        </form>
        <p class="error-message">
            O primeiro valor deve ser menor que o segundo valor.
        </p>
        <p class="success-message">

        </p>
    </section>
</body>
<script src="./main.js"></script>
</html>
